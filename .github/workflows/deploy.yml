name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Quartz plugins
        # v5: community plugins live in .quartz/ (gitignored) and are restored from
        # quartz.lock.json — clones each, runs npm install + build, regenerates
        # .quartz/plugins/index.ts. `npx quartz build` does NOT run this itself.
        run: npx quartz plugin restore
      - name: Build Quartz
        # ~19k pages (full texts + atomized excerpts): raise Node heap so the
        # parse/emit phases don't OOM on the runner.
        run: npx quartz build
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"
      - name: Build mobile search index
        # Derive the light contentIndexMobile.json from the built full index.
        run: node scripts/make-mobile-index.mjs
      - name: Compress desktop search index
        # Replace each page's full text with a short snippet + top TF-IDF terms so the
        # desktop contentIndex.json shrinks ~10x (~300MB -> ~26MB) while staying searchable.
        # Runs AFTER the mobile derivation, which needs the full text.
        run: node scripts/compress-search-index.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Slim tags index page
        # Replace the ~24MB server-rendered /tags/ aggregator with a lightweight client
        # table (static/tags.json + tags-table.js) so no single file nears the 25 MiB cap.
        run: node scripts/gen-tags-table.mjs public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
