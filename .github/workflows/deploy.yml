name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Quartz plugins
        # v5: community plugins live in .quartz/ (gitignored) and are restored from
        # quartz.lock.json — clones each, runs npm install + build, regenerates
        # .quartz/plugins/index.ts. `npx quartz build` does NOT run this itself.
        run: npx quartz plugin restore
      - name: Build Quartz
        # ~19k pages (full texts + atomized excerpts): raise Node heap so the
        # parse/emit phases don't OOM on the runner.
        run: npx quartz build
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"
      - name: Build mobile search index
        # Derive the light contentIndexMobile.json from the built full index.
        run: node scripts/make-mobile-index.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
