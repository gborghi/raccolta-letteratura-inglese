name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Quartz plugins
        # v5: community plugins live in .quartz/ (gitignored) and are restored from
        # quartz.lock.json — clones each, runs npm install + build, regenerates
        # .quartz/plugins/index.ts. `npx quartz build` does NOT run this itself.
        run: npx quartz plugin restore
      - name: Point baseUrl at GitHub Pages
        # The two hosts need DIFFERENT baseUrl values and there is only one config
        # file. Cloudflare is primary and root-mounted, so quartz.config.yaml holds
        # its domain; GitHub Pages serves from a subpath, and building with the CF
        # value bakes an empty basePath into every page — the SPA router, Explorer,
        # graph and search then emit links without the /raccolta-letteratura-inglese
        # prefix and the whole backup host 404s. Rewriting it here keeps the two
        # hosts from fighting over one line in git (it used to be flipped by hand,
        # which is why main and the working branch kept diverging on it).
        run: |
          sed -i 's|^  baseUrl: .*|  baseUrl: gborghi.github.io/raccolta-letteratura-inglese|' quartz.config.yaml
          grep -n '^  baseUrl:' quartz.config.yaml
      - name: Mojibake check (strict)
        # Fails the build on any garbled Latin/Greek or U+FFFD in content/ (Clio's QA plan §2;
        # strict since 2026-10-12 once the vault fixes reached 0). Set "0" to downgrade to warnings.
        run: node scripts/check-mojibake.mjs content
        env:
          MOJIBAKE_STRICT: "1"
      - name: Shakespeare cast check (one PERSONS OF THE PLAY per play)
        run: node --test scripts/check-mojibake.test.mjs scripts/check-shakespeare-cast.test.mjs && node scripts/check-shakespeare-cast.mjs content/testi/shakespeare
      - name: Build Quartz
        # ~19k pages (full texts + atomized excerpts): raise Node heap so the
        # parse/emit phases don't OOM on the runner.
        run: npx quartz build
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"
      - name: Thin pages noindex + redirects
        # noindex/sitemap/menu/search flag for template-only character pages, static
        # redirect pages from data/redirects.json. Must run before the index steps.
        run: node scripts/postbuild-pages.mjs public content
      - name: Copy sharded work indexes
        # /opere and /cerca fetch these. They live in quartz/static and are not
        # emitted by `quartz build` (local sync-and-build.sh copies them).
        run: |
          mkdir -p public/static
          cp quartz/static/index_a_m.json public/static/index_a_m.json
          cp quartz/static/index_n_z.json public/static/index_n_z.json
          cp quartz/static/index_leaf.json public/static/index_leaf.json
          cp quartz/static/concepts.json public/static/concepts.json
          cp quartz/static/works_kw.json public/static/works_kw.json
      - name: Inject atom search entries
        # Merge the committed data/atom_search.json.gz (per-atom search entries) into
        # the raw contentIndex.json before the TF-IDF master is built from it (atoms also
        # appear as leaf->work nodes in the graph).
        run: node scripts/inject-atom-search.mjs
      - name: Compress desktop index + build TF-IDF master
        # Projects contentIndex.json to the desktop budget (fetchData payload for the
        # graph + backlinks) AND writes the off-site master data/search-full-index.json,
        # read by both make-mobile-index.mjs and build-search-shards.mjs. Must run first.
        run: node scripts/compress-search-index.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Build mobile index
        # Light contentIndexMobile.json (graph/backlinks on narrow viewports), projected
        # from the master.
        run: node scripts/make-mobile-index.mjs
      - name: Build tiered search shards
        # Slice the master into search-t{0,1,2,3}.json (Fast/Standard/Deep/Max) for the
        # searchDepth depth slider. Fails loudly if any shard exceeds its per-file budget.
        run: node scripts/build-search-shards.mjs
      - name: Slim tags index page
        # Replace the ~24MB server-rendered /tags/ aggregator with a lightweight client
        # table (static/tags.json + tags-table.js) so no single file nears the 25 MiB cap.
        run: node scripts/gen-tags-table.mjs public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Primary host. Must NOT reuse the GH Pages artifact: that job rewrites baseUrl
  # to the /raccolta-letteratura-inglese subpath and would 404 on Pages.dev.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Quartz plugins
        run: npx quartz plugin restore
      - name: Mojibake check (strict)
        # Fails the build on any garbled Latin/Greek or U+FFFD in content/ (Clio's QA plan §2;
        # strict since 2026-10-12 once the vault fixes reached 0). Set "0" to downgrade to warnings.
        run: node scripts/check-mojibake.mjs content
        env:
          MOJIBAKE_STRICT: "1"
      - name: Shakespeare cast check (one PERSONS OF THE PLAY per play)
        run: node --test scripts/check-mojibake.test.mjs scripts/check-shakespeare-cast.test.mjs && node scripts/check-shakespeare-cast.mjs content/testi/shakespeare
      - name: Build Quartz (Cloudflare baseUrl from git)
        run: npx quartz build
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"
      - name: Thin pages noindex + redirects
        # noindex/sitemap/menu/search flag for template-only character pages, static
        # redirect pages from data/redirects.json. Must run before the index steps.
        run: node scripts/postbuild-pages.mjs public content
      - name: Copy sharded work indexes
        run: |
          mkdir -p public/static
          cp quartz/static/index_a_m.json public/static/index_a_m.json
          cp quartz/static/index_n_z.json public/static/index_n_z.json
          cp quartz/static/index_leaf.json public/static/index_leaf.json
          cp quartz/static/concepts.json public/static/concepts.json
          cp quartz/static/works_kw.json public/static/works_kw.json
      - name: Inject atom search entries
        run: node scripts/inject-atom-search.mjs
      - name: Compress desktop index + build TF-IDF master
        run: node scripts/compress-search-index.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Build mobile index
        run: node scripts/make-mobile-index.mjs
      - name: Build tiered search shards
        run: node scripts/build-search-shards.mjs
      - name: Slim tags index page
        run: node scripts/gen-tags-table.mjs public
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "88534a293fdf2c50b43a2fecdb0b59ed"
          command: pages deploy public --project-name letteratura-inglese --branch main
